# Documented exceptions for the OSV dependency scan (release gate + weekly).
# Every entry must say why the finding does not apply; delete entries the
# moment they stop being true.

[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
reason = "xlsx prototype pollution, fixed upstream in 0.19.3. We ship 0.20.3 straight from the vendor's CDN; the npm registry stopped receiving releases at 0.18.5, so the advisory's npm record carries no fixed version and every version looks affected to the scanner."

[[IgnoredVulns]]
id = "GHSA-5pgg-2g8v-p4x9"
reason = "xlsx ReDoS, fixed upstream in 0.20.2. Same situation: we ship 0.20.3 from the vendor's CDN, which the npm-ecosystem advisory record cannot see."

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-10-19
reason = "braces stack exhaustion on deeply nested patterns; no fixed version exists yet (3.0.3 is the latest). Development only: it reaches us through shx, which runs fixed commands from our own build scripts, so no outside pattern ever reaches it, and the installed app does not include it. Upstream Pi has the same chain. The date is on purpose: by then, upgrade if a fix exists, or decide again."

[[IgnoredVulns]]
id = "GHSA-ch52-4w7c-c8xp"
ignoreUntil = 2026-10-19
reason = "http-cache-semantics max-stale handling in a shared cache; no fixed version exists yet (4.3.0 changes only Vary matching). Development only: electron-builder pulls it in to download Electron at build time, for one user and never as a shared cache, and the installed app does not include it. The date is on purpose: by then, upgrade if a fix exists, or decide again."

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-10-19
reason = "KaTeX: an existing prototype pollution can bypass its trust restrictions; fixed in 0.18.2. KaTeX reaches the web app only through mermaid, which draws math in diagrams, and mermaid still asks for KaTeX 0.16 in its newest releases (11.17.2 and 12.1.0), as does the runtime's mini-lit, so the fixed version cannot be used yet. The flaw needs a separate prototype pollution in the page before it can do anything. The date is on purpose: by then, upgrade if mermaid allows it, or decide again."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2026-10-19
reason = "sprintf-js denial of service through unbounded precision specifiers; no fixed version exists yet (1.1.3 is the latest). Development only: electron-builder's Electron download helper pulls it in (through global-agent and roarr) for its log lines, it runs only while the desktop app is built, and the installed app does not include it. The date is on purpose: by then, upgrade if a fix exists, or decide again."
