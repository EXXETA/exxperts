[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-11-30
reason = "KaTeX: an existing prototype pollution can bypass its trust restrictions; fixed in 0.18.2. KaTeX reaches the web app only through mermaid, which draws math in diagrams. Mermaid 11 still asks for KaTeX 0.16 in its newest release (11.17.2). Mermaid 12.2.0 takes the fixed KaTeX, but it is a major upgrade that changes how every flowchart is laid out and drawn, so it comes with its own check of every diagram type. The flaw needs a separate prototype pollution in the page before it can do anything. The date is on purpose: by then, upgrade mermaid, or decide again."
