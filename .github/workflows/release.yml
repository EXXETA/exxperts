name: Release

# Builds the prebuilt per-OS archives (bundled Node runtime, no toolchain
# needed on the target machine), smoke-tests them on bare runners, and
# publishes a GitHub Release. workflow_dispatch runs everything except the
# publish job, so the pipeline can be exercised without shipping anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Default read-only token for every job; only the publish job elevates to
# contents: write at the job level.
permissions:
  contents: read

jobs:
  # A release must not ship a Node with known security holes. The script is
  # dependency-free and only needs the runner's stock node.
  node-currency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the vendored Node pin against nodejs.org
        run: node scripts/check-node-currency.mjs

  # Guards against tagging a commit whose package.json was never bumped: the
  # tag must be v<version> or v<version>-<suffix> (prerelease). On non-tag
  # runs (workflow_dispatch) this passes as a no-op rather than being skipped,
  # so the build job's `needs` never sees a skipped dependency.
  tag-version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Not a tag run; nothing to guard."
            exit 0
          fi
          version="$(node -p "require('./package.json').version")"
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version-"*)
              echo "Tag $GITHUB_REF_NAME matches package.json version $version."
              ;;
            *)
              echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
              echo "Expected v$version or v$version-<prerelease suffix>. Bump package.json (and re-tag) or fix the tag." >&2
              exit 1
              ;;
          esac

  # No release ships with a known vulnerability: the same OSV scan that runs
  # weekly also gates the tag. fail-on-vuln stops the pipeline before any
  # asset is built or published; SARIF upload stays off here (the scheduled
  # scan owns the Security tab).
  dependency-scan:
    permissions:
      actions: read
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --lockfile=./package-lock.json
        --lockfile=./runtime/package-lock.json
        --lockfile=./apps/desktop/package-lock.json

  build:
    needs: [node-currency, tag-version-guard, dependency-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          # bundle-release.mjs vendors the host platform's Node, so each
          # target must build on its matching runner.
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    # Full build plus a ~30 MB Node download from nodejs.org.
    timeout-minutes: 60
    env:
      # The archive build does not need the headless browser; skip the
      # ~150 MB download.
      EXXETA_SKIP_BROWSER_INSTALL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release archive
        run: node scripts/bundle-release.mjs --target ${{ matrix.target }} --out dist-release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist-release/exxperts-*
          if-no-files-found: error

  # The desktop apps ride the same pipeline: payloads are the CI-built
  # release archives (never a locally-built tree — the win-x64 payload rule),
  # each app built natively on its own OS runner, exactly like the local
  # scripts/package.mjs flow. The mac app then runs its real end-to-end smoke
  # (GUI works on macOS runners). This mac job is a build-validity check
  # only: its unsigned artifacts upload as a workflow artifact for
  # inspection, but the publish job drops them — the shipped mac app is
  # signed + notarized locally and attached to the release right after
  # publish.
  desktop-app-mac:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No EXXETA_SKIP_BROWSER_INSTALL here: generate-icon.mts renders the
      # icons through the repo's Playwright Chromium.
      - name: Install dependencies
        run: npm ci

      - name: Install desktop shell dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-darwin-arm64
          path: apps/desktop/build/payload

      - name: Build macOS app (dmg + zip)
        working-directory: apps/desktop
        run: node scripts/package.mjs --skip-bundle

      - name: Smoke-test the packaged macOS app
        working-directory: apps/desktop
        run: npm run smoke:packaged

      - name: Checksum the app artifacts
        working-directory: apps/desktop
        # shellcheck disable=SC2016 # single quotes are deliberate: JS, not shell
        run: |
          node -e '
            const { createHash } = require("crypto");
            const fs = require("fs");
            const artifacts = fs.readdirSync("dist-app").filter((f) =>
              /^exxperts-desktop-.*\.(dmg|zip)$/.test(f));
            if (artifacts.length !== 2) {
              console.error(`expected 2 mac app artifacts (dmg + zip), found: ${artifacts.join(", ") || "none"}`);
              process.exit(1);
            }
            for (const name of artifacts) {
              const hash = createHash("sha256").update(fs.readFileSync(`dist-app/${name}`)).digest("hex");
              fs.writeFileSync(`dist-app/${name}.sha256`, `${hash}  ${name}\n`);
              console.log(`${hash}  ${name}`);
            }
          '

      # latest-mac.yml + blockmap are the one-click updater's feed: the
      # sha512 inside binds them to the exact zip built here. None of this
      # reaches the public release (the publish job drops it); the signed
      # local build brings its own dmg/zip/latest-mac.yml/blockmap set, which
      # must always travel together — a feed from one build with a zip from
      # another makes every installed app's updater fail checksum
      # verification and fall back to the manual download.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-app-mac
          path: |
            apps/desktop/dist-app/exxperts-desktop-*.dmg
            apps/desktop/dist-app/exxperts-desktop-*.zip
            apps/desktop/dist-app/*.sha256
            apps/desktop/dist-app/latest-mac.yml
            apps/desktop/dist-app/*.blockmap
          if-no-files-found: error

  # The Windows app builds on a Windows runner because Authenticode signing
  # cannot run anywhere else: electron-builder signs every binary during
  # packaging via Azure Trusted Signing (the electron-builder-win-signed.yml
  # overlay that --sign-windows selects). Authentication is OIDC-only — the
  # job's id-token plus azure/login against the production-signing
  # environment's federated credential; no signing secret exists anywhere.
  # package.mjs then verifies the Authenticode signatures on the packaged
  # exes and fails the job if any is missing or invalid, so this job can
  # never ship unsigned artifacts while claiming to sign.
  desktop-app-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    environment: production-signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No EXXETA_SKIP_BROWSER_INSTALL here either: generate-icon.mts renders
      # the icons through the repo's Playwright Chromium.
      - name: Install dependencies
        run: npm ci

      - name: Install desktop shell dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-win-x64
          path: apps/desktop/build/payload

      - name: Azure login (OIDC, for Trusted Signing)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and sign Windows app (zip + setup exe)
        working-directory: apps/desktop
        run: node scripts/package.mjs --target win-x64 --skip-bundle --sign-windows

      - name: Checksum the app artifacts
        working-directory: apps/desktop
        shell: bash
        # shellcheck disable=SC2016 # single quotes are deliberate: JS, not shell
        run: |
          node -e '
            const { createHash } = require("crypto");
            const fs = require("fs");
            const artifacts = fs.readdirSync("dist-app").filter((f) =>
              /^exxperts-(desktop-.*\.zip|setup-.*\.exe)$/.test(f));
            if (artifacts.length !== 2) {
              console.error(`expected 2 windows app artifacts (zip + setup exe), found: ${artifacts.join(", ") || "none"}`);
              process.exit(1);
            }
            for (const name of artifacts) {
              const hash = createHash("sha256").update(fs.readFileSync(`dist-app/${name}`)).digest("hex");
              fs.writeFileSync(`dist-app/${name}.sha256`, `${hash}  ${name}\n`);
              console.log(`${hash}  ${name}`);
            }
          '

      # latest.yml + blockmap: the Windows one-click updater's feed, bound by
      # sha512 to the setup exe built and signed here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-desktop-app-windows
          path: |
            apps/desktop/dist-app/exxperts-desktop-*.zip
            apps/desktop/dist-app/exxperts-setup-*.exe
            apps/desktop/dist-app/*.sha256
            apps/desktop/dist-app/latest.yml
            apps/desktop/dist-app/*.blockmap
          if-no-files-found: error

  # Deliberately no setup-node here: the archive must run without any
  # provisioned toolchain, so these jobs stay as close to a bare machine as a
  # hosted runner allows. The runner's stock node only launches the smoke
  # driver, which sanitizes the environment before exercising the archive.
  bare-machine-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Checkout only to get scripts/smoke-release-archive.mjs; no install.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ matrix.target }}
          path: dist-release

      # Recompute the hash with node's crypto so the same step works on all
      # three runners (no sha256sum/shasum/certutil divergence).
      - name: Verify checksum file matches the archive
        shell: bash
        run: |
          cd dist-release
          shopt -s nullglob
          set -- exxperts-*.tar.gz exxperts-*.zip
          archive="${1:-}"
          test -n "$archive" || { echo "no archive found in dist-release" >&2; exit 1; }
          # shellcheck disable=SC2016 # single quotes are deliberate: the $ and backticks below are JS, not shell
          node -e '
            const { createHash } = require("crypto");
            const { readFileSync } = require("fs");
            const archive = process.argv[1];
            const actual = createHash("sha256").update(readFileSync(archive)).digest("hex");
            const line = readFileSync(archive + ".sha256", "utf8").trim();
            const expected = line.split(/\s+/)[0];
            if (actual !== expected) {
              console.error(`checksum mismatch for ${archive}: expected ${expected}, got ${actual}`);
              process.exit(1);
            }
            console.log(`checksum OK: ${actual}  ${archive}`);
          ' "$archive"

      - name: Smoke-test the archive on a bare machine
        shell: bash
        run: |
          shopt -s nullglob
          set -- dist-release/exxperts-*.tar.gz dist-release/exxperts-*.zip
          test -n "${1:-}" || { echo "no archive found in dist-release" >&2; exit 1; }
          node scripts/smoke-release-archive.mjs "$1"

  # Only tag pushes publish. The event check matters: a workflow_dispatch can
  # be aimed at a tag ref, which would satisfy ref_type == 'tag' alone and
  # break the dry-run promise, so manual runs always stop after the smoke
  # matrix regardless of the chosen ref.
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [bare-machine-smoke, desktop-app-mac, desktop-app-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creating the release and uploading assets needs write; scoped to this
      # job so the build/smoke jobs keep the default read-only token.
      contents: write
    steps:
      # Checkout only to read the tagged package.json version for the release
      # notes; no install.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      # The desktop-app-mac job is build-validation only; its unsigned app
      # must never reach the public release. Drop everything it produced
      # before SHA256SUMS.txt is assembled, so no unsigned mac bytes and no
      # mac checksum lines can ship from CI. The signed replacements arrive
      # post-publish — see the loud comment at the release-create step.
      - name: Exclude the unsigned CI mac app from the release
        run: |
          cd dist-release
          rm -f exxperts-desktop-*-mac-arm64* latest-mac.yml
          ls -la

      - name: Assemble SHA256SUMS.txt
        run: |
          cd dist-release
          cat ./*.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The archives sat in artifact storage between the smoke jobs and this
      # one; recompute every hash against SHA256SUMS.txt (same node crypto
      # recompute the smoke jobs use) so storage corruption in that window
      # cannot ship a broken asset.
      - name: Re-verify every archive against SHA256SUMS.txt
        run: |
          cd dist-release
          # shellcheck disable=SC2016 # single quotes are deliberate: the $ and backticks below are JS, not shell
          node -e '
            const { createHash } = require("crypto");
            const { readFileSync, readdirSync } = require("fs");
            const sums = new Map(readFileSync("SHA256SUMS.txt", "utf8").trim().split("\n").map((line) => {
              const [hash, name] = line.trim().split(/\s+/);
              return [name, hash];
            }));
            const archives = readdirSync(".").filter((f) =>
              f.endsWith(".tar.gz") || f.endsWith(".zip") || f.endsWith(".dmg") || f.endsWith(".exe"));
            for (const name of sums.keys()) {
              if (!archives.includes(name)) {
                console.error(`SHA256SUMS.txt lists ${name} but the archive is missing`);
                process.exit(1);
              }
            }
            if (archives.length === 0) {
              console.error("no archives found to verify");
              process.exit(1);
            }
            for (const archive of archives) {
              const expected = sums.get(archive);
              if (!expected) {
                console.error(`SHA256SUMS.txt has no entry for ${archive}`);
                process.exit(1);
              }
              const actual = createHash("sha256").update(readFileSync(archive)).digest("hex");
              if (actual !== expected) {
                console.error(`checksum mismatch for ${archive}: expected ${expected}, got ${actual}`);
                process.exit(1);
              }
              console.log(`checksum OK: ${actual}  ${archive}`);
            }
          '

      # Versionless copies of the app artifacts so the README's
      # /releases/latest/download/ links never rot across releases. Created
      # after the checksum re-verify: each alias is a byte copy of an
      # already-verified file, and gets its own SHA256SUMS.txt line so a
      # download via the stable link verifies by name too. The upload globs
      # below match the alias names as well. The two mac aliases
      # (exxperts-desktop-mac-arm64.dmg / .zip) are NOT created here — they
      # are byte copies of the signed local mac build, added post-publish
      # (see the loud comment at the release-create step).
      - name: Add stable-alias app downloads
        run: |
          version="$(node -p "require('./package.json').version")"
          cd dist-release
          cp "exxperts-desktop-$version-win-x64.zip" exxperts-desktop-win-x64.zip
          cp "exxperts-setup-$version.exe" exxperts-setup-win-x64.exe
          # shellcheck disable=SC2016 # single quotes are deliberate: JS, not shell
          node -e '
            const { createHash } = require("crypto");
            const fs = require("fs");
            const aliases = ["exxperts-desktop-win-x64.zip", "exxperts-setup-win-x64.exe"];
            for (const name of aliases) {
              const hash = createHash("sha256").update(fs.readFileSync(name)).digest("hex");
              fs.appendFileSync("SHA256SUMS.txt", `${hash}  ${name}\n`);
              console.log(`${hash}  ${name}`);
            }
          '

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          # The heredoc stays quoted so nothing in the body is shell-expanded;
          # the version is substituted afterwards from the checked-out
          # package.json (never from workflow expression interpolation).
          cat > release-notes.md <<'EOF'
          Prebuilt Exxperts archives with a vendored Node runtime. No Node, npm, or Git needs to be installed on the target machine; unpack and run.

          Desktop app (window + tray around the same local server). Both desktop builds are signed — the macOS app is notarized by Apple, the Windows binaries are publisher-signed by Exxeta AG — so neither platform shows an unknown-publisher prompt on first launch:

          | Platform | Download |
          | --- | --- |
          | Windows x64 installer | `exxperts-setup-__VERSION__.exe` |
          | Windows x64 portable | `exxperts-desktop-__VERSION__-win-x64.zip` |
          | macOS Apple Silicon | `exxperts-desktop-__VERSION__-mac-arm64.dmg` (or the `-mac-arm64.zip`) — the macOS assets are attached within minutes of this release going live (they are uploaded from the signed build) |

          The versionless copies of the same files (`exxperts-desktop-mac-arm64.dmg`, `exxperts-setup-win-x64.exe`, ...) exist so `releases/latest/download` links always point at the newest release; they have their own lines in `SHA256SUMS.txt`.

          Server archives (the `exxperts` command, for terminal use or the one-line installers):

          | Platform | Download |
          | --- | --- |
          | Windows x64 | `exxperts-__VERSION__-win-x64.zip` |
          | macOS Apple Silicon | `exxperts-__VERSION__-darwin-arm64.tar.gz` |
          | Linux x64 | `exxperts-__VERSION__-linux-x64.tar.gz` |

          Verify your download (--ignore-missing checks only the file you downloaded):

          ```
          shasum -a 256 --ignore-missing -c SHA256SUMS.txt
          ```

          (On Windows PowerShell: `(Get-FileHash exxperts-__VERSION__-win-x64.zip -Algorithm SHA256).Hash` and compare against the archive's line in SHA256SUMS.txt.)

          Checksums are computed in CI from the tagged commit; each archive also passed a bare-machine smoke test on its target OS before this release was published. The macOS desktop lines are appended to `SHA256SUMS.txt` when the signed macOS assets are attached.
          EOF
          # A semver version has no sed replacement metacharacters (& / \).
          sed -i "s/__VERSION__/$version/g" release-notes.md
          # latest.yml / *.blockmap feed the desktop apps' user-initiated
          # one-click updater (electron-updater reads them from the latest
          # release). nullglob keeps a missing blockmap from turning into a
          # literal unmatched-glob argument.
          #
          # ============== NO MAC DESKTOP ASSETS ARE UPLOADED HERE ==========
          # The macOS desktop assets are DELIBERATELY absent from this list.
          # They come from the signed local build (Developer ID + notarized +
          # stapled) and are uploaded to this release right after publish:
          #   - the signed dmg + zip
          #   - their .sha256 files, with their lines APPENDED to
          #     SHA256SUMS.txt
          #   - latest-mac.yml + the zip blockmap from that SAME signed build
          #     (never mix builds — the updater verifies by sha512)
          #   - the two mac stable-alias copies
          #     (exxperts-desktop-mac-arm64.dmg / .zip), also byte copies of
          #     the signed build, with their own SHA256SUMS.txt lines
          # Never attach the CI mac build: it is unsigned and exists only as
          # a build-validity check.
          # =================================================================
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease_flag \
            dist-release/exxperts-*.tar.gz dist-release/exxperts-*.zip \
            dist-release/exxperts-setup-*.exe \
            dist-release/latest*.yml dist-release/*.blockmap \
            dist-release/SHA256SUMS.txt
