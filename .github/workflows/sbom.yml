name: SBOM

# Two supply-chain nets, complementing Dependabot's advisory matching:
# - CycloneDX SBOMs for the app and the runtime, attached to every release
#   (and kept as run artifacts on scheduled/manual runs), so any scanner or
#   audit can consume the full dependency inventory without cloning the repo.
# - A weekly OSV scan over both lockfiles, which draws on a broader database
#   than Dependabot (including malicious-package reports) and fails loudly.
# Release-time SBOM attachment lives in release.yml (a release created with
# the workflow token cannot fire this workflow's release trigger). This
# workflow owns the scheduled scan and on-demand SBOM artifacts.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate SBOMs (CycloneDX)
        run: |
          # All three SBOMs read the lockfiles directly: no installed tree is
          # needed, so nothing platform-specific (mac-only optionals, runtime
          # workspace links) can make the inventory fail.
          npx --yes @cyclonedx/cyclonedx-npm@4 --package-lock-only --omit dev --output-format JSON --output-file sbom-app.cdx.json
          cd runtime && npx --yes @cyclonedx/cyclonedx-npm@4 --package-lock-only --omit dev --output-format JSON --output-file ../sbom-runtime.cdx.json
          cd ../apps/desktop && npx --yes @cyclonedx/cyclonedx-npm@4 --package-lock-only --output-format JSON --output-file ../../sbom-desktop.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-app.cdx.json
            sbom-runtime.cdx.json
            sbom-desktop.cdx.json

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=./package-lock.json
        --lockfile=./runtime/package-lock.json
        --lockfile=./apps/desktop/package-lock.json
